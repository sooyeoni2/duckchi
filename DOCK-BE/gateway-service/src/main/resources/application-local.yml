eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka}

spring:
  cloud:
    gateway:
      routes:
        - id: core-service
          uri: lb://core-service
          predicates:
            - Path=/api/v1/auth/**, /api/v1/home/**, /api/v1/profiles/**

        - id: pay-service
          uri: lb://pay-service
          predicates:
            - Path=/api/v1/rooms/**, /api/v1/payments/**, /api/v1/settlements/**

        - id: insight-service
          uri: lb://insight-service
          predicates:
            - Path=/api/v1/analytics/**, /api/v1/games/**