eureka:
  client:
    enabled: false # 로컬 개발 시 Eureka 서버 없이 독립 실행 가능하게 함.
    register-with-eureka: false
    fetch-registry: false

spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:duckchi_pay}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

# [External API] 외부 금융망 연동 설정
finance:
  api:
    base-url: https://finopenapi.ssafy.io
    key: ${FINANCE_API_KEY}

# [Internal Service] 타 서비스 연동 (Hybrid FeignClient 대비)
services:
  core-service:
    url: http://localhost:8081 # 로컬 개발 시 직접 호출 주소임.
  pay-service:
    url: http://localhost:8082
  insight-service:
    url: http://localhost:8083
