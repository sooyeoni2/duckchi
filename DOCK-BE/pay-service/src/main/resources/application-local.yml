eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka}

spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:duckchi_pay}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

finance:
  api:
    base-url: https://finopenapi.ssafy.io
    key: ${FINANCE_API_KEY}

ocr:
  naver:
    invoke-url: ${OCR_INVOKE_URL:https://d08yg29f59.apigw.ntruss.com/custom/v1/50894/f7980422559ea99385065c11fe74224da20963803d0ecb060c7c902dd012e782/document/receipt}
    secret: ${OCR_SECRET_KEY}
