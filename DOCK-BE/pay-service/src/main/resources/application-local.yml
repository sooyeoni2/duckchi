eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka}

spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:duckchi_pay}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  kafka:
    #Kafka broker 주소
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      # 브로커가 안전하게 받았는지 확인
      acks: all
      # 일시적 장애 때 producer 재시도
      retries: 3
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5

finance:
  api:
    base-url: https://finopenapi.ssafy.io
    key: ${FINANCE_API_KEY}

ocr:
  naver:
    invoke-url: ${OCR_INVOKE_URL:https://d08yg29f59.apigw.ntruss.com/custom/v1/50894/f7980422559ea99385065c11fe74224da20963803d0ecb060c7c902dd012e782/document/receipt}
    secret: ${OCR_SECRET_KEY}
