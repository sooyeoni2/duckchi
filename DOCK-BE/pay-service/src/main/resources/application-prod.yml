eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL}

spring:
  datasource:
    url: jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD:}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false

# [External API] 외부 금융망 연동 설정
finance:
  api:
    base-url: https://finopenapi.ssafy.io
    key: ${FINANCE_API_KEY}

ocr:
  naver:
    invoke-url: ${OCR_INVOKE_URL}
    secret: ${OCR_SECRET_KEY}

swagger:
  server-url: http://j14c102.p.ssafy.io
