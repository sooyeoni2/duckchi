eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL}

spring:
  datasource:
    url: jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD:}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false

  kafka:
    #Kafka broker 주소
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      # 브로커가 안전하게 받았는지 확인
      acks: all
      # 일시적 장애 때 producer 재시도
      retries: 3
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5

# [External API] 외부 금융망 연동 설정
finance:
  api:
    base-url: https://finopenapi.ssafy.io
    key: ${FINANCE_API_KEY}

ocr:
  naver:
    invoke-url: ${OCR_INVOKE_URL}
    secret: ${OCR_SECRET_KEY}

swagger:
  server-url: ${SWAGGER_SERVER_URL:https://j14c102.p.ssafy.io}

springdoc:
  swagger-ui:
    config-url: /api/payment/v3/api-docs/swagger-config
    url: /api/payment/v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  prometheus:
    metrics:
      export:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        "[http.server.requests]": true