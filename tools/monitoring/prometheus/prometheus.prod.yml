global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'core-service'
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['core-service:8081']
        labels:
          application: core-service

  - job_name: 'gateway-service'
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['gateway-service:8080']
        labels:
          application: gateway-service

  - job_name: 'pay-service'
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['pay-service:8082']
        labels:
          application: pay-service

  - job_name: 'insight-service'
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['insight-service:8083']
        labels:
          application: insight-service

  - job_name: 'discovery-service'
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['discovery-service:8761']
        labels:
          application: discovery-service